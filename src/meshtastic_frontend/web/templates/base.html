<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Meshtastic Live{% endblock %}</title>
    
    {% block head_extra %}{% endblock %}

    <style>
        /* ════════════════════════════════════════════════════════════════════
           DESIGN TOKENS  — change here, cascade everywhere
        ════════════════════════════════════════════════════════════════════ */
        :root {
            --bg-page:        #0b1120;
            --bg-panel:       #111827;
            --bg-card:        #1a2333;
            --bg-card-hover:  #1f2b40;
            --border:         #1e3a5f;
            --border-light:   #2a4a70;
            --accent:         #3b82f6;
            --accent-dim:     #1d4ed8;
            --green:          #22c55e;
            --yellow:         #f59e0b;
            --red:            #ef4444;
            --text-primary:   #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted:     #475569;
            --font-ui:        'Inter', system-ui, sans-serif;
            --font-mono:      'IBM Plex Mono', 'Courier New', monospace;
            --radius-sm:      4px;
            --radius-md:      8px;
            --radius-lg:      12px;
            --header-h:       56px;
            --footer-h:       36px;
        }

        /* ════════════════════════════════════════════════════════════════════
           Self-hosted Fonts - Offline
        ════════════════════════════════════════════════════════════════════ */
        @font-face {
            font-family: 'Inter';
            src: url('/static/fonts/inter/InterVariable.woff2') format('woff2-variations');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Inter';
            src: url('/static/fonts/inter/Inter-Italic.woff2') format('woff2');
            font-weight: 100 900;
            font-style: italic;
            font-display: swap;
        }

        @font-face {
            font-family: 'IBM Plex Mono';
            src: url('/static/fonts/ibm-plex-mono/IBMPlexMono-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'IBM Plex Mono';
            src: url('/static/fonts/ibm-plex-mono/IBMPlexMono-Medium.woff2') format('woff2');
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }

        /* ════════════════════════════════════════════════════════════════════
           RESET & BASE
        ════════════════════════════════════════════════════════════════════ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            font-family:    var(--font-ui);
            background:     var(--bg-page);
            color:          var(--text-primary);
            display:        flex;
            flex-direction: column;
            height:         100vh;   /* lock to viewport — no body scroll */
            font-size:      14px;
            line-height:    1.6;
            overflow:       hidden;
        }

        a { color: var(--accent); text-decoration: none; }
        a:hover { color: var(--text-primary); }

        /* ════════════════════════════════════════════════════════════════════
           HEADER
        ════════════════════════════════════════════════════════════════════ */
        header {
            flex-shrink:   0;
            height:        var(--header-h);
            background:    var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display:       flex;
            align-items:   center;
            justify-content: space-between;
            padding:       0 24px;
            z-index:       200;
        }

        .header-brand { display: flex; align-items: center; gap: 10px; }

        .header-brand .logo-icon {
            width: 32px; height: 32px;
            background:    var(--accent-dim);
            border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
        }

        .header-brand h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }

        .header-status {
            display: flex; align-items: center; gap: 8px;
            font-family: var(--font-mono);
            font-size:   12px;
            color:       var(--text-secondary);
        }

        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--green);
            animation:  pulse 2.5s ease-in-out infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .status-badge {
            background:    #0f2a1a;
            color:         var(--green);
            border:        1px solid #1a4a2e;
            border-radius: var(--radius-sm);
            padding:       2px 8px;
            font-size:     11px;
            font-weight:   500;
        }

        /* ════════════════════════════════════════════════════════════════════
           LAYOUT SHELL  (sidebar + content)
        ════════════════════════════════════════════════════════════════════ */
        .layout {
            flex:       1;
            display:    flex;
            overflow:   hidden;
            min-height: 0;   /* critical flex shrink fix */
        }

        /* ════════════════════════════════════════════════════════════════════
           SIDEBAR
        ════════════════════════════════════════════════════════════════════ */
        .sidebar {
            width:          220px;
            flex-shrink:    0;
            background:     var(--bg-panel);
            border-right:   1px solid var(--border);
            padding:        20px 12px;
            display:        flex;
            flex-direction: column;
            gap:            4px;
            overflow-y:     auto;
        }

        .sidebar-label {
            font-size:      10px;
            font-weight:    600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color:          var(--text-muted);
            padding:        8px 12px 4px;
        }

        /* Nav items are real <a> links for URL routing */
        .nav-item {
            display:       flex;
            align-items:   center;
            gap:           10px;
            padding:       8px 12px;
            border-radius: var(--radius-md);
            color:         var(--text-secondary);
            font-size:     13px;
            font-weight:   500;
            transition:    background 0.15s, color 0.15s;
            cursor:        pointer;
            user-select:   none;
            text-decoration: none;  /* override <a> underline */
        }

        .nav-item:hover { background: var(--bg-card); color: var(--text-primary); }
        .nav-item.active { background: #1e3a5f; color: var(--accent); }
        .nav-item .nav-icon { font-size: 16px; opacity: 0.85; }

        .sidebar-stats {
            margin-top:    auto;
            padding:       12px;
            background:    var(--bg-card);
            border:        1px solid var(--border);
            border-radius: var(--radius-md);
        }

        .sidebar-stats p {
            font-family: var(--font-mono);
            font-size:   11px;
            color:       var(--text-secondary);
            line-height: 1.8;
            display:     flex;
            justify-content: space-between;
        }

        .sidebar-stats span { color: var(--text-primary); }

        /* ════════════════════════════════════════════════════════════════════
           CONTENT AREA  (right of sidebar)
        ════════════════════════════════════════════════════════════════════ */
        .content {
            flex:           1;
            display:        flex;
            flex-direction: column;
            overflow:       hidden;
            min-height:     0;
        }

        /* ════════════════════════════════════════════════════════════════════
           SHARED TOOLBAR
        ════════════════════════════════════════════════════════════════════ */
        .toolbar {
            flex-shrink:   0;
            padding:       14px 20px;
            border-bottom: 1px solid var(--border);
            display:       flex;
            align-items:   center;
            justify-content: space-between;
        }

        .toolbar h2 { font-size: 14px; font-weight: 600; color: var(--text-primary); }

        .toolbar-meta {
            font-family: var(--font-mono);
            font-size:   11px;
            color:       var(--text-muted);
        }

        /* ════════════════════════════════════════════════════════════════════
           SHARED BUTTONS
        ════════════════════════════════════════════════════════════════════ */
        .btn-ghost {
            background:    transparent;
            border:        1px solid var(--border-light);
            color:         var(--text-secondary);
            border-radius: var(--radius-sm);
            padding:       5px 12px;
            font-size:     12px;
            font-family:   var(--font-ui);
            cursor:        pointer;
            transition:    border-color 0.15s, color 0.15s;
        }

        .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

        .btn-primary {
            background:    var(--accent-dim);
            border:        1px solid var(--accent);
            color:         #fff;
            border-radius: var(--radius-sm);
            padding:       5px 14px;
            font-size:     12px;
            font-family:   var(--font-ui);
            cursor:        pointer;
            transition:    background 0.15s;
        }

        .btn-primary:hover { background: var(--accent); }

        /* ════════════════════════════════════════════════════════════════════
           FOOTER  — flex-shrink:0 means content can NEVER push it off-screen
        ════════════════════════════════════════════════════════════════════ */
        footer {
            flex-shrink:   0;
            height:        var(--footer-h);
            background:    var(--bg-panel);
            border-top:    1px solid var(--border);
            padding:       0 24px;
            display:       flex;
            align-items:   center;
            justify-content: space-between;
            font-family:   var(--font-mono);
            font-size:     11px;
            color:         var(--text-muted);
            z-index:       200;
        }

        {% block extra_styles %}{% endblock %}
    </style>
</head>
<body>

    <!-- ── Header ──────────────────────────────────────────────────────────── -->
    <header>
        <div class="header-brand">
            <div class="logo-icon">📡</div>
            <h1>Meshtastic Live</h1>
        </div>
        <div class="header-status">
            <div class="status-dot" id="ws-dot"></div>
            <span>SDRangel</span>
            <span class="status-badge">UDP {{ udp_port | default(9999) }}</span>
        </div>
    </header>

    <!-- ── Layout ──────────────────────────────────────────────────────────── -->
    <div class="layout">

        <!-- Sidebar: nav links use real URLs so the browser history works -->
        <nav class="sidebar">
            <div class="sidebar-label">Navigation</div>

            <a href="/"       class="nav-item {% if active_page == 'messages' %}active{% endif %}">
                <span class="nav-icon">💬</span> Messages
            </a>
            <a href="/map"    class="nav-item {% if active_page == 'map' %}active{% endif %}">
                <span class="nav-icon">🗺️</span> Map
            </a>
            <a href="/config" class="nav-item {% if active_page == 'config' %}active{% endif %}">
                <span class="nav-icon">⚙️</span> Config
            </a>

            <!-- Stats updated by app.js via window.meshStats -->
            <div class="sidebar-stats">
                <p>Nodes count   <span id="stat-nodes">—</span></p>
                <p>Message count <span id="stat-msgs">—</span></p>
                <p>Uptime        <span id="stat-uptime">00:00</span></p>
            </div>
        </nav>

        <!-- Page-specific content injected here -->
        <div class="content">
            {% block content %}{% endblock %}
        </div>

    </div>

    <!-- ── Footer ──────────────────────────────────────────────────────────── -->
    <footer>
        <span>Meshtastic Live v0.1</span>
        <span id="ws-status">Connecting…</span>
    </footer>

    <!-- Shared WebSocket + state manager (loaded on every page) -->
    <script src="/static/app.js"></script>

    {% block page_scripts %}{% endblock %}

</body>
</html>
